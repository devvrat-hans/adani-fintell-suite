<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sidebar Test</title>
    <link rel="stylesheet" href="css/sidebar.css">
    <link rel="stylesheet" href="css/navbar.css">
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }
        
        /* Test styles */
        .test-submenu-visible .sidebar-submenu {
            opacity: 1 !important;
            visibility: visible !important;
            pointer-events: auto !important;
            transform: translateX(0) !important;
            background: yellow !important;
        }
    </style>
</head>
<body>
    <div style="padding: 20px; margin-left: 100px;">
        <h1>Sidebar Submenu Test</h1>
        <p>Hover over the sidebar sections to see submenus</p>
        <button onclick="document.querySelector('.sidebar-section-group').classList.toggle('test-submenu-visible')">Toggle Submenu (Test)</button>
    </div>

    <!-- Load sidebar directly -->
    <aside class="app-sidebar" role="complementary" aria-label="Side Navigation" style="top: 0;">
        <nav class="sidebar-nav">
            <ul class="sidebar-menu">
                <!-- Main Section Group -->
                <li class="sidebar-section-group">
                    <div class="sidebar-section-header">
                        <span class="section-icon">🏠</span>
                        <span class="section-title">Main</span>
                    </div>
                    
                    <!-- Submenu for Main -->
                    <div class="sidebar-submenu">
                        <div class="sidebar-submenu-header">
                            <h4 class="submenu-title">Main Menu</h4>
                        </div>
                        <ul class="sidebar-submenu-items">
                            <li class="sidebar-item">
                                <a href="dashboard.html" class="sidebar-link" data-page="dashboard">
                                    <span class="sidebar-icon">📊</span>
                                    <span class="sidebar-text">Dashboard</span>
                                </a>
                            </li>
                        </ul>
                    </div>
                </li>
            </ul>
        </nav>
    </aside>

    <script>
        // Add hover listener for debugging
        document.querySelectorAll('.sidebar-section-group').forEach(group => {
            group.addEventListener('mouseenter', () => {
                console.log('Hovering over section group');
                const submenu = group.querySelector('.sidebar-submenu');
                console.log('Submenu element:', submenu);
                console.log('Submenu computed styles:', window.getComputedStyle(submenu));
            });
        });
    </script>
</body>
</html>
