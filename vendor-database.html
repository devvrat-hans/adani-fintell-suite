<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Vendor Database - Adani Fintell Suite">
    <title>Vendor Database - Adani FinTell Suite</title>
    
    <!-- Stylesheets -->
    <link rel="stylesheet" href="css/navbar.css">
    <link rel="stylesheet" href="css/sidebar.css">
    <link rel="stylesheet" href="css/vendor-database.css">
    
    <!-- Template Loader -->
    <script src="js/utils/templates.js"></script>
</head>
<body class="loading-layout">
    <!-- Navbar Container -->
    <div id="navbar-placeholder"></div>

    <!-- Sidebar Container -->
    <div id="sidebar-placeholder"></div>

    <!-- Main Content -->
    <main class="main-content" role="main">
        <div class="page-container">
            <!-- Page Header -->
            <header class="page-header">
                <div class="header-content">
                    <h1 class="page-title">Vendor Database</h1>
                    <p class="page-description">Manage and view all vendor information across Adani Group</p>
                </div>
            </header>

            <!-- Search & Filter Section -->
            <section class="search-section">
                <div class="search-card">
                    <div class="search-bar-container">
                        <!-- Search Input -->
                        <div class="search-input-wrapper">
                            <svg class="search-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" width="20" height="20">
                                <path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
                            </svg>
                            <input 
                                type="text" 
                                id="search-input" 
                                class="search-input" 
                                placeholder="Search by vendor name, code, or GST number..."
                                data-search-input
                                aria-label="Search vendors"
                            />
                        </div>
                        
                        <!-- Refresh Button -->
                        <button class="btn-refresh" id="refresh-btn" type="button" data-action="refresh" aria-label="Refresh vendor list">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="20" height="20">
                                <path d="M21.5 2v6h-6M2.5 22v-6h6M2 11.5a10 10 0 0 1 18.8-4.3M22 12.5a10 10 0 0 1-18.8 4.2"/>
                            </svg>
                            Refresh
                        </button>
                    </div>
                </div>
            </section>

            <!-- Table Section -->
            <section class="table-section">
                <div class="table-card">
                    <div class="table-responsive">
                        <table class="vendor-table" id="vendor-table">
                            <thead>
                                <tr>
                                    <th>Vendor Code</th>
                                    <th>Vendor Name</th>
                                    <th>GST Number</th>
                                    <th>Contact Person</th>
                                    <th>Email</th>
                                    <th>Phone</th>
                                    <th>Address</th>
                                    <th>Status</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody id="vendor-table-body">
                                <!-- Table rows will be populated by JavaScript -->
                            </tbody>
                        </table>
                    </div>

                    <!-- Pagination -->
                    <div class="pagination-container">
                        <div class="pagination-info">
                            Showing <span id="showing-start">0</span> to <span id="showing-end">0</span> of <span id="total-vendors">0</span> vendors
                        </div>
                        <div class="pagination-controls">
                            <button class="pagination-btn" id="prev-page" type="button" data-action="prev-page" disabled>Previous</button>
                            <span class="page-numbers" id="page-numbers"></span>
                            <button class="pagination-btn" id="next-page" type="button" data-action="next-page">Next</button>
                        </div>
                    </div>
                </div>
            </section>
        </div>
    </main>

    <!-- Scripts -->
    <script src="js/page/vendor-database.js" defer></script>
</body>
</html>
