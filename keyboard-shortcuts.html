<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Keyboard Shortcuts - Adani-Fintell-Suite">
    <title>Keyboard Shortcuts - Adani-Fintell-Suite</title>
    
    <!-- Stylesheets -->
    <link rel="stylesheet" href="css/navbar.css">
    <link rel="stylesheet" href="css/sidebar.css">
    <link rel="stylesheet" href="css/keyboard-shortcuts.css">
</head>
<body>
    <!-- Navbar Container -->
    <div id="navbar-placeholder"></div>
    
    <!-- Sidebar Container -->
    <div id="sidebar-placeholder"></div>
    
    <!-- Main Content -->
    <main class="main-content" role="main">
        <div class="shortcuts-page">
            <!-- Page Header -->
            <header class="shortcuts-header">
                <h1 class="shortcuts-title">⌨️ Keyboard Shortcuts</h1>
                <p class="shortcuts-subtitle">Master these shortcuts to boost your productivity</p>
            </header>
            
            <!-- Shortcuts Grid -->
            <div class="shortcuts-grid" id="shortcuts-grid">
                <!-- Categories will be dynamically inserted here -->
            </div>
            
            <!-- Platform Indicator -->
            <div class="platform-indicator">
                <strong>Tip:</strong> On Mac, <kbd class="key key--ctrl">Ctrl</kbd> is replaced with <kbd class="key key--cmd">⌘</kbd> (Command key)
            </div>
        </div>
    </main>
    
    <!-- Scripts -->
    <script src="js/utils/api-endpoints.js"></script>
    <script src="js/utils/templates.js"></script>
    <script src="js/core/navbar.js" defer></script>
    <script src="js/core/sidebar.js" defer></script>
    <script type="module" src="js/page/keyboard-shortcuts.js"></script>
</body>
</html>
