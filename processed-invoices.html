<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Processed Invoices - Adani Fintell Suite">
    <title>Processed Invoices | Adani Fintell Suite</title>
    <link rel="icon" type="image/png" href="assets/images/logos/favicon.png">
    
    <!-- Styles -->
    <link rel="stylesheet" href="css/processed-invoices.css?v=2.0">
    <link rel="stylesheet" href="css/notification.css?v=2.0">
    
    <!-- Template Loader -->
    <script src="js/utils/templates.js"></script>
</head>
<body class="loading-layout">
    <!-- Navbar Placeholder -->
    <div id="navbar-placeholder"></div>
    
    <!-- Sidebar Placeholder -->
    <div id="sidebar-placeholder"></div>
    
    <!-- Main Content -->
    <main class="processed-invoices-main">
        <div class="processed-invoices-container">
            <!-- Page Header -->
            <header class="page-header">
                <div class="header-content">
                    <div class="header-text">
                        <h1 class="page-title">Processed Invoices</h1>
                        <p class="page-subtitle">Track invoice processing status and results</p>
                    </div>
                </div>
                <div class="header-controls">
                    <button class="btn-refresh" id="refreshBtn" aria-label="Refresh data">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="23 4 23 10 17 10"></polyline>
                            <polyline points="1 20 1 14 7 14"></polyline>
                            <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
                        </svg>
                        <span>Refresh</span>
                    </button>
                </div>
            </header>

            <!-- Summary Cards -->
            <section class="summary-section">
                <div class="summary-card summary-card-total">
                    <div class="summary-icon">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8l-6-6z"/>
                            <path d="M14 2v6h6"/>
                        </svg>
                    </div>
                    <div class="summary-content">
                        <h3 class="summary-value" id="totalProcessed">0</h3>
                        <p class="summary-label">Total Processed</p>
                    </div>
                </div>

                <div class="summary-card summary-card-success">
                    <div class="summary-icon">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/>
                        </svg>
                    </div>
                    <div class="summary-content">
                        <h3 class="summary-value" id="successCount">0</h3>
                        <p class="summary-label">Successful</p>
                    </div>
                </div>

                <div class="summary-card summary-card-failed">
                    <div class="summary-icon">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/>
                        </svg>
                    </div>
                    <div class="summary-content">
                        <h3 class="summary-value" id="failedCount">0</h3>
                        <p class="summary-label">Failed</p>
                    </div>
                </div>

                <div class="summary-card summary-card-processing">
                    <div class="summary-icon">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M12 4V1L8 5l4 4V6c3.31 0 6 2.69 6 6 0 1.01-.25 1.97-.7 2.8l1.46 1.46C19.54 15.03 20 13.57 20 12c0-4.42-3.58-8-8-8zm0 14c-3.31 0-6-2.69-6-6 0-1.01.25-1.97.7-2.8L5.24 7.74C4.46 8.97 4 10.43 4 12c0 4.42 3.58 8 8 8v3l4-4-4-4v3z"/>
                        </svg>
                    </div>
                    <div class="summary-content">
                        <h3 class="summary-value" id="processingCount">0</h3>
                        <p class="summary-label">Processing</p>
                    </div>
                </div>
            </section>

            <!-- Filters & Search -->
            <section class="filters-section">
                <div class="search-container">
                    <svg class="search-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="11" cy="11" r="8"></circle>
                        <path d="m21 21-4.35-4.35"></path>
                    </svg>
                    <input type="text" id="searchInput" class="search-input" placeholder="Search by invoice number or vendor...">
                </div>

                <div class="filters-container">
                    <select id="statusFilter" class="filter-select">
                        <option value="">All Status</option>
                        <option value="success">Success</option>
                        <option value="failed">Failed</option>
                        <option value="processing">Processing</option>
                    </select>

                    <select id="stageFilter" class="filter-select">
                        <option value="">All Stages</option>
                        <option value="ocr">OCR Processing</option>
                        <option value="arithmetical">Arithmetical Check</option>
                        <option value="gst_validation">GST Validation</option>
                        <option value="duplicate_check">Duplicate Check</option>
                        <option value="price_anomaly">Price Anomaly</option>
                    </select>

                    <input type="date" id="dateFromFilter" class="filter-select" placeholder="From Date">
                    <input type="date" id="dateToFilter" class="filter-select" placeholder="To Date">
                </div>
            </section>

            <!-- Processed Invoices Table -->
            <section class="table-section">
                <div class="table-header">
                    <h2 class="section-title">Processing History</h2>
                </div>
                
                <div class="table-container">
                    <table class="invoices-table" id="invoicesTable">
                        <thead>
                            <tr>
                                <th>Invoice Number</th>
                                <th>Vendor</th>
                                <th>Amount</th>
                                <th>Processed Date</th>
                                <th>Status</th>
                                <th>Processing Time</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="invoicesTableBody">
                            <tr class="loading-row">
                                <td colspan="7" class="text-center">Loading processed invoices...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <div class="pagination-container" id="paginationContainer">
                    <!-- Pagination will be populated by JavaScript -->
                </div>
            </section>
        </div>
    </main>

    <!-- Processing Details Modal -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-container">
            <div class="modal-header">
                <h3 class="modal-title">Processing Details</h3>
                <button class="modal-close" id="modalClose" aria-label="Close modal">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="18" y1="6" x2="6" y2="18"></line>
                        <line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg>
                </button>
            </div>
            <div class="modal-body" id="modalBody">
                <!-- Content will be populated by JavaScript -->
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="js/utils/api-endpoints.js?v=2.0"></script>
    <script src="js/utils/notification.js?v=2.0"></script>
    <script type="module" src="js/page/processed-invoices.js?v=2.0"></script>
</body>
</html>
