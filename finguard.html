<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="FinGuard AI - Invoice OCR and GST validation for Adani Group">
    <title>FinGuard AI - Adani-Fintell-Suite</title>
    
    <!-- Stylesheets -->
    <link rel="stylesheet" href="css/navbar.css">
    <link rel="stylesheet" href="css/sidebar.css">
    <link rel="stylesheet" href="css/finguard.css">
</head>
<body>
    <!-- Navbar Container -->
    <div id="navbar-placeholder"></div>
    
    <!-- Sidebar Container -->
    <div id="sidebar-placeholder"></div>
    
    <!-- Main Content -->
    <main class="main-content" role="main">
        <div class="page-container">
            <!-- Page Header -->
            <header class="page-header">
                <div class="header-content">
                    <h1 class="page-title">FinGuard AI</h1>
                    <p class="page-description">Upload invoices for intelligent OCR processing, GST validation, and compliance checking</p>
                </div>
            </header>
            
            <!-- Upload Section -->
            <section class="upload-section">
                <div class="upload-card">
                    <div class="card-header">
                        <h2 class="card-title">Upload Invoice Document</h2>
                        <p class="card-subtitle">Supported formats: PDF, PNG, JPEG (Max 10MB)</p>
                    </div>
                    
                    <div class="card-body">
                        <!-- File Upload Area -->
                        <div class="upload-area" data-upload-area>
                            <div class="upload-icon">
                                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" width="48" height="48">
                                    <path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM14 13v4h-4v-4H7l5-5 5 5h-3z"/>
                                </svg>
                            </div>
                            <p class="upload-text">Drag & drop your invoice here</p>
                            <p class="upload-subtext">or</p>
                            <button class="browse-btn" type="button" data-action="browse-file">Browse Files</button>
                            <input type="file" id="fileInput" accept=".pdf,.png,.jpg,.jpeg" hidden data-file-input>
                        </div>
                        
                        <!-- File Preview -->
                        <div class="file-preview" data-file-preview style="display: none;">
                            <div class="preview-header">
                                <div class="file-info">
                                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" width="24" height="24">
                                        <path d="M14 2H6c-1.1 0-1.99.9-1.99 2L4 20c0 1.1.89 2 1.99 2H18c1.1 0 2-.9 2-2V8l-6-6zm2 16H8v-2h8v2zm0-4H8v-2h8v2zm-3-5V3.5L18.5 9H13z"/>
                                    </svg>
                                    <div class="file-details">
                                        <p class="file-name" data-file-name>document.pdf</p>
                                        <p class="file-size" data-file-size>2.5 MB</p>
                                    </div>
                                </div>
                                <button class="remove-file-btn" type="button" data-action="remove-file" aria-label="Remove file">
                                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" width="20" height="20">
                                        <path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/>
                                    </svg>
                                </button>
                            </div>
                        </div>
                        
                        <!-- Submit Button -->
                        <div class="submit-section">
                            <button class="submit-btn" type="button" data-action="process-file" disabled>
                                <span class="btn-text">Process Invoice</span>
                                <svg class="btn-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" width="20" height="20">
                                    <path d="M12 4l-1.41 1.41L16.17 11H4v2h12.17l-5.58 5.59L12 20l8-8z"/>
                                </svg>
                            </button>
                        </div>
                        
                        <!-- Loading State -->
                        <div class="loading-state" data-loading-state style="display: none;">
                            <div class="spinner"></div>
                            <p class="loading-text">Processing your invoice...</p>
                            <p class="loading-subtext">This may take a few moments</p>
                        </div>
                    </div>
                </div>
            </section>
            
            <!-- Results Section -->
            <section class="results-section" data-results-section style="display: none;">
                <div class="results-card">
                    <div class="card-header">
                        <h2 class="card-title">OCR Results</h2>
                        <button class="copy-btn" type="button" data-action="copy-results" aria-label="Copy results">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" width="20" height="20">
                                <path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/>
                            </svg>
                            Copy
                        </button>
                    </div>
                    <div class="card-body">
                        <div class="results-content" data-results-content>
                            <!-- OCR results will be displayed here -->
                        </div>
                    </div>
                </div>
            </section>
        </div>
    </main>
    
    <!-- Scripts -->
    <script src="js/utils/api-endpoints.js"></script>
    <script src="js/utils/templates.js"></script>
    <script src="js/core/navbar.js" defer></script>
    <script src="js/core/sidebar.js" defer></script>
    <script src="js/page/finguard.js" defer></script>
</body>
</html>
