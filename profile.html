<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="User Profile - Adani-Fintell-Suite">
    <title>My Profile - Adani-Fintell-Suite</title>
    
    <!-- Stylesheets -->
    <link rel="stylesheet" href="css/navbar.css">
    <link rel="stylesheet" href="css/sidebar.css">
    <link rel="stylesheet" href="css/profile.css">
</head>
<body>
    <!-- Navbar Container -->
    <div id="navbar-placeholder"></div>
    
    <!-- Sidebar Container -->
    <div id="sidebar-placeholder"></div>
    
    <!-- Main Content -->
    <main class="main-content" role="main">
        <div class="page-container">
            <!-- Page Header -->
            <header class="page-header">
                <div class="header-content">
                    <h1 class="page-title">My Profile</h1>
                    <p class="page-description">View and manage your personal information</p>
                </div>
            </header>
            
            <!-- Profile Section -->
            <section class="profile-section">
                <!-- Profile Card -->
                <div class="profile-card">
                    <div class="card-header">
                        <div class="profile-header-info">
                            <h2 class="profile-name" data-profile-name>User Name</h2>
                            <p class="profile-email" data-profile-email>user@adani.com</p>
                        </div>
                    </div>
                    
                    <div class="card-body">
                        <!-- Personal Information Section -->
                        <div class="info-section">
                            <h3 class="section-title">Personal Information</h3>
                            <div class="info-grid">
                                <div class="info-item">
                                    <label class="info-label">Full Name</label>
                                    <p class="info-value" data-info-name>-</p>
                                </div>
                                <div class="info-item">
                                    <label class="info-label">Email Address</label>
                                    <p class="info-value" data-info-email>-</p>
                                </div>
                                <div class="info-item">
                                    <label class="info-label">Role</label>
                                    <p class="info-value" data-info-role>-</p>
                                </div>
                                <div class="info-item">
                                    <label class="info-label">Department</label>
                                    <p class="info-value" data-info-department>-</p>
                                </div>
                            </div>
                        </div>
                        
                        <!-- Account Information Section -->
                        <div class="info-section">
                            <h3 class="section-title">Account Information</h3>
                            <div class="info-grid">
                                <div class="info-item">
                                    <label class="info-label">Account Status</label>
                                    <p class="info-value">
                                        <span class="status-badge status-active" data-info-status>Active</span>
                                    </p>
                                </div>
                                <div class="info-item">
                                    <label class="info-label">Last Login</label>
                                    <p class="info-value" data-info-last-login>-</p>
                                </div>
                            </div>
                        </div>
                        
                        <!-- Additional Details Section -->
                        <div class="info-section">
                            <h3 class="section-title">Additional Details</h3>
                            <div class="info-grid">
                                <div class="info-item">
                                    <label class="info-label">Organization</label>
                                    <p class="info-value" data-info-organization>Adani Group</p>
                                </div>
                                <div class="info-item">
                                    <label class="info-label">Entities Access</label>
                                    <p class="info-value" data-info-entities>-</p>
                                </div>
                            </div>
                        </div>
                    </div>
                    
                    <div class="card-footer">
                        <button class="btn btn-secondary" data-action="change-password">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" width="20" height="20">
                                <path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm0 10.99h7c-.53 4.12-3.28 7.79-7 8.94V12H5V6.3l7-3.11v8.8z"/>
                            </svg>
                            Change Password
                        </button>
                        <button class="btn btn-primary" data-action="edit-profile">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" width="20" height="20">
                                <path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/>
                            </svg>
                            Edit Profile
                        </button>
                    </div>
                </div>
            </section>
        </div>
    </main>
    
    <!-- Scripts -->
    <script src="js/utils/api-endpoints.js"></script>
    <script src="js/utils/templates.js"></script>
    <script src="js/core/navbar.js" defer></script>
    <script src="js/core/sidebar.js" defer></script>
    <script src="js/page/profile.js" defer></script>
</body>
</html>
