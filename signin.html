<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Sign In to Adani-Fintell-Suite - Financial Intelligence Platform">
    <title>Sign In | Adani-Fintell-Suite</title>
    <link rel="stylesheet" href="css/signin.css">
</head>
<body>
    <!-- Main Sign In Container -->
    <main class="signin-main">
        <div class="signin-container">
            <!-- Left Side - Branding -->
            <div class="signin-branding">
                <div class="branding-content">
                    <a href="index.html" class="back-home-link">
                        <svg class="back-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" width="20" height="20">
                            <path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/>
                        </svg>
                        <span>Back to Home</span>
                    </a>
                    <h2 class="branding-title">Welcome Back</h2>
                    <p class="branding-subtitle">
                        Access your financial intelligence platform to manage 1,000+ entities with AI-powered automation
                    </p>
                    <div class="branding-features">
                        <div class="branding-feature">
                            <div class="feature-icon">
                                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" width="40" height="40">
                                    <path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm0 10.99h7c-.53 4.12-3.28 7.79-7 8.94V12H5V6.3l7-3.11v8.8z"/>
                                </svg>
                            </div>
                            <div class="feature-text">
                                <h3>FinGuard AI</h3>
                                <p>Invoice OCR & Compliance</p>
                            </div>
                        </div>
                        <div class="branding-feature">
                            <div class="feature-icon">
                                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" width="40" height="40">
                                    <path d="M3.5 18.5l6-6 4 4L22 6.92 20.59 5.5l-7.09 8-4-4-6 6L3.5 18.5z"/>
                                </svg>
                            </div>
                            <div class="feature-text">
                                <h3>SheetSense AI</h3>
                                <p>Balance Sheet Assurance</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Right Side - Sign In Form -->
            <div class="signin-form-container">
                <div class="signin-form-wrapper">
                    <h2 class="form-title">Sign In</h2>
                    <p class="form-subtitle">Enter your credentials to access your account</p>

                    <!-- Sign In Form -->
                    <form id="signin-form" class="signin-form" novalidate>
                        <!-- Email Field -->
                        <div class="form-group">
                            <label for="email" class="form-label">Email Address</label>
                            <input 
                                type="email" 
                                id="email" 
                                name="email"
                                class="form-input"
                                placeholder="you@adani.com"
                                data-field="email"
                                required
                                aria-required="true"
                                aria-describedby="email-error"
                            >
                            <span id="email-error" class="error-message" role="alert"></span>
                        </div>

                        <!-- Password Field -->
                        <div class="form-group">
                            <label for="password" class="form-label">Password</label>
                            <div class="password-input-wrapper">
                                <input 
                                    type="password" 
                                    id="password" 
                                    name="password"
                                    class="form-input"
                                    placeholder="Enter your password"
                                    data-field="password"
                                    required
                                    aria-required="true"
                                    aria-describedby="password-error"
                                >
                                <button 
                                    type="button" 
                                    class="toggle-password"
                                    data-action="toggle-password"
                                    aria-label="Toggle password visibility"
                                >
                                    <svg class="eye-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" width="20" height="20">
                                        <path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/>
                                    </svg>
                                </button>
                            </div>
                            <span id="password-error" class="error-message" role="alert"></span>
                        </div>

                        <!-- Forgot Password -->
                        <div class="form-options">
                            <a href="#forgot-password" class="forgot-password-link" data-action="forgot-password">
                                Forgot Password?
                            </a>
                        </div>

                        <!-- Submit Button -->
                        <button 
                            type="submit" 
                            class="btn-submit"
                            data-action="submit-signin"
                        >
                            <span class="btn-text">Sign In</span>
                            <span class="btn-loader" style="display: none;"></span>
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </main>

    <!-- Loading Overlay -->
    <div class="loading-overlay" data-loading="hidden" aria-live="polite" aria-busy="false">
        <div class="loading-spinner"></div>
        <p class="loading-text">Signing you in...</p>
    </div>

    <script src="js/utils/api-endpoints.js"></script>
    <script src="js/page/signin.js"></script>
</body>
</html>
